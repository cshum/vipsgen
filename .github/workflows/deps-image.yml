name: Dependency image

on:
  push:
    branches:
      - main
    paths:
      - docker/deps.Dockerfile
      - .github/workflows/deps-image.yml
  pull_request:
    paths:
      - docker/deps.Dockerfile
      - .github/workflows/deps-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build deps image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/deps.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/deps:24.04-v2
