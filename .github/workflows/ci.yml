name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message (optional)'
        required: false
        default: 'build: update generated vips packages'
        type: string

jobs:
  generate:
    name: Generate code for libvips ${{ matrix.vips_version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - vips_version: "8.16.1"
            output_dir: "vips816"
          - vips_version: "8.17.3"
            output_dir: "vips817"
          - vips_version: "8.18.7"
            output_dir: "vips"
            ultrahdr: "true"
    env:
      CGO_CFLAGS_ALLOW: -Xpreprocessor
      VIPS_VERSION: ${{ matrix.vips_version }}
      V: 6

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ^1.24
          cache: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          meson ninja-build cmake \
          libglib2.0-dev libexpat-dev librsvg2-dev libpng-dev \
          libjpeg-turbo8-dev libimagequant-dev libfftw3-dev \
          libpoppler-glib-dev libxml2-dev \
          libopenslide-dev libcfitsio-dev liborc-0.4-dev libpango1.0-dev \
          libtiff5-dev libgsf-1-dev giflib-tools libwebp-dev libheif-dev \
          libopenjp2-7-dev libcgif-dev \
          gobject-introspection libgirepository1.0-dev \
          libmagickwand-dev libmatio-dev libnifti2-dev \
          libjxl-dev libzip-dev libarchive-dev \
          libraw-dev
          
          # Create missing NIfTI pkg-config file to help libvips meson detect it
          # Ubuntu's libnifti2-dev doesn't provide the pkg-config file that libvips expects
          sudo mkdir -p /usr/local/lib/pkgconfig
          sudo tee /usr/local/lib/pkgconfig/niftiio.pc > /dev/null <<EOF
          prefix=/usr
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib/x86_64-linux-gnu
          includedir=\${prefix}/include/nifti
          
          Name: libniftiio
          Description: nifti library
          Version: 3.0.1
          Requires: 
          Cflags: -I\${includedir}
          Libs: -L\${libdir} -lniftiio -lznz
          EOF

      - name: Build libultrahdr
        if: matrix.ultrahdr == 'true'
        run: |
          # Ubuntu 24.04 does not package libultrahdr, and libvips only has the UltraHDR
          # loader when it is present at configure time.
          git clone --depth 1 --branch v1.4.0 https://github.com/google/libultrahdr.git
          cmake -S libultrahdr -B libultrahdr/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUHDR_BUILD_EXAMPLES=OFF \
            -DUHDR_BUILD_TESTS=OFF \
            -DUHDR_BUILD_BENCHMARK=OFF
          cmake --build libultrahdr/build -j"$(nproc)"
          sudo cmake --install libultrahdr/build
          sudo ldconfig
          pkg-config --modversion libuhdr

      - name: Cache libvips
        uses: actions/cache@v5
        with:
          path: vips-${{ matrix.vips_version }}
          key: ${{ runner.os }}-24.04-vips-introspection-${{ env.V }}-${{ matrix.vips_version }}-uhdr-${{ matrix.ultrahdr }}
          restore-keys: |
            ${{ runner.os }}-24.04-vips-introspection-${{ env.V }}-

      - name: Build libvips from source
        run: |
          if [ ! -d "vips-${{ matrix.vips_version }}" ]
          then
            wget https://github.com/libvips/libvips/releases/download/v${{ matrix.vips_version }}/vips-${{ matrix.vips_version }}.tar.xz
            tar xf vips-${{ matrix.vips_version }}.tar.xz
          fi
          cd vips-${{ matrix.vips_version }}
          
          # Detect all available features. The uhdr option only exists from 8.18, so it is
          # passed where the dependency was built.
          EXTRA_FEATURES=""
          if [ "${{ matrix.ultrahdr }}" = "true" ]; then EXTRA_FEATURES="-Duhdr=enabled"; fi

          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/pkgconfig meson setup _build \
          --buildtype=release \
          --strip \
          --prefix=/usr/local \
          --libdir=lib \
          -Dmagick=enabled \
          -Dopenslide=enabled \
          -Dintrospection=enabled \
          -Djpeg-xl=enabled \
          $EXTRA_FEATURES
          
          ninja -C _build
          sudo ninja -C _build install
          sudo ldconfig

      - name: Verify vips and introspection
        run: |
          echo "Checking vips version and introspection files"
          vips --version
          ls -la /usr/local/share/gir-1.0/ || true
          ls -la /usr/share/gir-1.0/ || true
          pkg-config --modversion gobject-introspection-1.0 || true
          # List all loaders and savers to verify formats
          echo "All supported formats:"
          vips --list | grep -E "load|save"

      - name: Cache Go dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get dependencies
        run: go mod download

      - name: Build vipsgen
        run: |
          mkdir -p bin
          go build -o bin/vipsgen cmd/vipsgen/main.go

      - name: Run generator unit tests
        run: go test -count=1 ./internal/... -coverprofile=internal.out

      - name: Generate vips package
        run: |
          mkdir -p ${{ matrix.output_dir }}
          ./bin/vipsgen -out ${{ matrix.output_dir }} --include-test

      - name: Compile the generated C with warnings
        run: |
          for src in ${{ matrix.output_dir }}/*.c; do
            cc -fsyntax-only -Werror \
               -Wall -Wextra -Wmissing-prototypes -Wstrict-prototypes -Wshadow \
               $(pkg-config --cflags vips) -I ${{ matrix.output_dir }} "$src"
          done

      - name: Run tests
        run: |
          $(CGO_CFLAGS_ALLOW="-Xpreprocessor") go test -v ./${{ matrix.output_dir }}/... \
            -coverprofile=coverage.out

      - name: Upload coverage
        # the generator tests run on all three legs; one upload is enough
        if: matrix.output_dir == 'vips'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out,./internal.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Build examples
        if: matrix.output_dir == 'vips'
        run: |
          # the examples import the 8.18 package, which this leg has just regenerated,
          # so they only compile where that version is installed
          if [ -n "$(gofmt -l examples/)" ]; then gofmt -l examples/; exit 1; fi
          $(CGO_CFLAGS_ALLOW="-Xpreprocessor") go build ./examples/...

      - name: Upload generated bindings
        uses: actions/upload-artifact@v5
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.output_dir }}
          path: ${{ matrix.output_dir }}
          retention-days: 1

  commit:
    name: Commit all generated bindings
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Download generated bindings
        uses: actions/download-artifact@v5
        with:
          # one artifact per package, named after its output dir: vips* restores vips/, vips816/, vips817/
          pattern: vips*
          path: .

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: update generated vips packages"
          file_pattern: "vips*"

  commit-manual:
    name: Create PR with generated bindings
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Download generated bindings
        uses: actions/download-artifact@v5
        with:
          pattern: vips*
          path: .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: ${{ inputs.commit_message }}
          title: ${{ inputs.commit_message }}
          body: "Auto-generated bindings from manual workflow dispatch"
          branch: generated-files-${{ github.run_number }}
          delete-branch: true
